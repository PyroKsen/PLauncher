<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>

    <main class="main">
      <div class="window-controls">
        <button id="minimize-window-btn" class="window-control no-drag" type="button" aria-label="Minimize">-</button>
        <button id="close-window-btn" class="window-control window-control--close no-drag" type="button" aria-label="Close">x</button>
      </div>
      <aside class="sidebar">
        <h1 class="sidebar__title">PLauncher</h1>
        <div class="sidebar__divider"></div>
        <button class="sidebar__button sidebar__button--active" data-game="Barotrauma">barotrauma</button>
        <button class="sidebar__button" data-game="LethalCompany">lethal company</button>
        <button class="sidebar__button" data-game="SlayTheSpire2">slay the spire 2</button>
      </aside>
      <div class="base">
        <div class="base__top">
          <div class="base__top-left">

          </div>
          <div class="base__top-right">
            <ul class="spisok">
              <li class="spisok__element" id="version-b"></li>
              <li class="spisok__element" id="local-version"></li>
              <li class="spisok__element" id="server-version"></li>
              <li class="spisok__element" id="server-source"></li>
            </ul>
          </div>
        </div>
        <div class="base__bottom" id="progress-section">
          <progress id="combined-progress" value="0" max="100"></progress>
          <span id="combined-percent">0%</span>
          <span id="download-stats" class="download-stats"></span>
          <button id="check-btn" class="no-drag">check</button>
          <button id="download-btn" class="no-drag">load</button>
          <button id="cancel-btn" class="no-drag" disabled>cancel</button>
          <button id="open-folder-btn" class="no-drag" disabled>folder</button>
          <button id="launch-btn" class="no-drag">play</button>
        </div>
      </div>
    </main>
  </body>
  <script defer src="renderer.js"></script>
</html>
