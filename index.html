<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>

    <main class="main">
      <div class="window-controls">
        <button id="minimize-window-btn" class="window-control no-drag" type="button" aria-label="Свернуть">-</button>
        <button id="close-window-btn" class="window-control window-control--close no-drag" type="button" aria-label="Закрыть">x</button>
      </div>
      <div class="first-run-overlay first-run-overlay--hidden" id="first-run-overlay">
        <section class="first-run-dialog no-drag">
          <h2 class="first-run-dialog__title">Выберите папку установки игр</h2>
          <p class="first-run-dialog__text">В эту папку будут скачиваться и распаковываться игры.</p>
          <button class="first-run-dialog__button no-drag" id="first-run-choose-btn" type="button">Выбрать папку</button>
          <div class="first-run-dialog__error" id="first-run-error"></div>
        </section>
      </div>
      <aside class="sidebar">
        <h1 class="sidebar__title">PLauncher</h1>
        <div class="sidebar__divider"></div>
        <button class="sidebar__button sidebar__button--active" data-game="Barotrauma">barotrauma</button>
        <button class="sidebar__button" data-game="LethalCompany">lethal company</button>
        <button class="sidebar__button" data-game="SlayTheSpire2">slay the spire 2</button>
        <button class="sidebar__button" data-game="CasualtiesUnknown">Casualties Unknown</button>
        <button class="sidebar__button" data-game="RiskOfRain2">Risk of Rain 2</button>
        <div class="launcher-update">
          <div class="launcher-update__version" id="launcher-version">версия лаунчера: -</div>
          <div class="launcher-update__status" id="launcher-update-status">проверка обновления...</div>
          <button class="launcher-update__button no-drag" id="launcher-update-btn" type="button">Проверить лаунчер</button>
          <button class="launcher-update__button no-drag" id="open-logs-btn" type="button">Открыть логи</button>
        </div>
      </aside>
      <div class="base">
        <div class="base__top">
          <div class="base__top-left">
            <h2 class="game-placeholder" id="game-placeholder" hidden></h2>
          </div>
          <div class="base__top-right">
            <ul class="spisok">
              <li class="spisok__element" id="version-b"></li>
              <li class="spisok__element" id="local-version"></li>
              <li class="spisok__element" id="server-version"></li>
              <li class="spisok__element" id="server-source"></li>
              <li class="spisok__element spisok__element--path" id="games-folder"></li>
            </ul>
          </div>
        </div>
        <div class="base__bottom" id="progress-section">
          <div class="progress-strip">
            <progress id="combined-progress" value="0" max="100"></progress>
            <span id="combined-percent">0%</span>
            <span id="download-stats" class="download-stats"></span>
          </div>
          <div class="action-bar">
            <button id="check-btn" class="control-button control-button--wide no-drag">Проверить версию игры</button>
            <button id="download-btn" class="control-button no-drag">Скачать</button>
            <button id="cancel-btn" class="control-button control-button--danger no-drag" disabled>Отмена</button>
            <button id="games-dir-btn" class="control-button control-button--wide no-drag">Папка установки игр</button>
            <button id="open-folder-btn" class="control-button control-button--wide no-drag" disabled>Открыть папку игры</button>
            <button id="launch-btn" class="control-button control-button--primary no-drag">Играть</button>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script defer src="renderer.js"></script>
</html>
